unique_name: fact_realized_gain
object_type: dataset
label: fact_realized_gain
description: Realized sell lots (Dec-2025 TLH + 2026 YTD trims). Transactional (additive). term Short/Long is degenerate; realized_loss/realized_profit are calculated columns splitting the gain sign (NLQ4).
connection_id: Connection - Wealth Portfolio
table: fact_realized_gain
columns:
- name: realized_id
  data_type: long
- name: account_id
  data_type: long
- name: security_id
  data_type: long
- name: sell_date
  data_type: date
- name: quantity
  data_type: decimal(18,2)
- name: proceeds
  data_type: decimal(18,2)
- name: cost_basis
  data_type: decimal(18,2)
- name: realized_gain
  data_type: decimal(18,2)
- name: term
  data_type: string
- name: realized_loss
  data_type: decimal(18,2)
  sql: CASE WHEN realized_gain < 0 THEN realized_gain ELSE 0 END
  dialects:
  - dialect: DatabricksSQL
    sql: CASE WHEN realized_gain < 0 THEN realized_gain ELSE 0 END
- name: realized_profit
  data_type: decimal(18,2)
  sql: CASE WHEN realized_gain > 0 THEN realized_gain ELSE 0 END
  dialects:
  - dialect: DatabricksSQL
    sql: CASE WHEN realized_gain > 0 THEN realized_gain ELSE 0 END
