- name: month_name
  data_type: string
- name: year_month
  data_type: string
- name: quarter_num
  data_type: long
- name: quarter_name
  data_type: string
- name: is_quarter_end
  data_type: boolean
- name: is_year_end
  data_type: boolean
- name: prior_year_num
  data_type: long
  sql: year_num - 1
  dialects:
  - dialect: DatabricksSQL
    sql: year_num - 1
