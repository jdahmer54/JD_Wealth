unique_name: wealth_portfolio_nlq
object_type: model
label: Wealth Portfolio NLQ
visible: true
description: 'Client Portfolio Performance & Allocation for a Merrill Lynch-style wirehouse advisory book. Answers: performance vs S&P 500, allocation drift vs target, asset/sector exposure, realized vs unrealized gains, household AUM by advisor.'
relationships:
- unique_name: rel_position_asof_date
